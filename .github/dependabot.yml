version: 2
updates:
  # The CLI's own tooling. The templates are rebuilt from express-node-starter,
  # which has its own Dependabot: update there, then run npm run sync:templates.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Major versions need code changes: upgrade them on purpose, not from a bot.
    # Vulnerabilities are still reported in the Security tab.
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
