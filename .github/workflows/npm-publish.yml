# Publishes to npm when a GitHub release is published, through npm trusted publishing:
# no npm token is stored, and npm records a provenance attestation that links the
# package to this workflow run and commit.
# Setup (once): on npmjs.com, package settings → Trusted publisher → GitHub Actions,
# repository fadhlaouir/create-express-node-starter, workflow npm-publish.yml, environment npm.

name: Publish to npm

on:
  release:
    types: [published]
  # Publishes an existing release again, for example after a failed run.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v3.0.0
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # required for trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm 11.5.1 or later, which ships with Node.js 24.
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check that the tag matches the package version
        run: test "v$(node -p 'require("./package.json").version')" = "$TAG"
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm publish --provenance --access public
